<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0A1C" />
    <title>OZYVTT — Style Guide</title>
    <script>try{var t=localStorage.getItem("vtt.theme");document.documentElement.setAttribute("data-theme",t==="dusk"||t==="light"?t:"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  </head>
  <body>
    <div id="styleguide-root"></div>
    <script type="module" src="/src/styleguide-main.tsx"></script>
  </body>
</html>
