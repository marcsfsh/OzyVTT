<title>OzyVTT Consistency Sweep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Bai+Jamjuree:wght@400;500;600&family=VT323&display=swap">
<style>
/* Layout: one reading column of findings, then each pattern as a wall of the captures taken from the approved mockups. */
:root {
  --bg: #11142a; --panel: #171b35; --line: #2a3058; --text: #e9ebfb; --dim: #a6abcf; --muted: #7d83aa;
  --cyan: #4fd6f3; --amber: #ffb84d; --ground: #0b0d1c;
  --f-display: "Chakra Petch", "Bai Jamjuree", system-ui, sans-serif;
  --f-body: "Bai Jamjuree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eef0f8; --panel: #ffffff; --line: #cfd3e8; --text: #1b1f3b; --dim: #4a5078; --muted: #6c7296; --cyan: #0b7ea0; --amber: #a35c00; --ground: #1b1f3b; color-scheme: light; } }
:root[data-theme="light"] { --bg: #eef0f8; --panel: #ffffff; --line: #cfd3e8; --text: #1b1f3b; --dim: #4a5078; --muted: #6c7296; --cyan: #0b7ea0; --amber: #a35c00; --ground: #1b1f3b; color-scheme: light; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 40px; }
.eyebrow { margin: 0; font: 600 12px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 10px; font: 600 clamp(26px, 4vw, 38px)/1.1 var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; text-wrap: balance; }
h2 { margin: 0; font: 600 20px/1.2 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance; }
h3 { margin: 0; font: 600 16px/1.3 var(--f-display); letter-spacing: 0.03em; }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--dim); }
.n { font: 400 20px/1 var(--f-num); color: var(--cyan); }
.findings { display: grid; gap: 0; border-top: 1px solid var(--line); }
.finding { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.finding .num { font: 400 34px/1 var(--f-num); color: var(--amber); }
.finding p { color: var(--dim); font-size: 14px; }
.finding .fix { color: var(--text); }
.finding .fix b { font-weight: 600; color: var(--cyan); }
section.pattern { display: grid; gap: 14px; }
section.pattern > header { display: grid; gap: 6px; }
.wall { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); align-items: start; }
.wall.wide { grid-template-columns: minmax(0, 1fr); }
.wall.sheets { grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); }
figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.shot { background: var(--ground); border: 1px solid var(--line); overflow: hidden; max-height: 460px; }
.wall.wide .shot { max-height: none; overflow-x: auto; }
.shot img { display: block; width: 100%; height: auto; }
.wall.wide .shot img { width: auto; max-width: 100%; }
figure.off .shot { border-color: var(--amber); }
figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; }
figcaption .area { font-weight: 600; }
figcaption .page { color: var(--muted); }
.flag { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; border: 1px solid var(--amber); color: var(--amber); font: 400 17px/1 var(--f-num); }
.sub { margin-top: 6px; font: 600 12px/1 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ask { padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
