<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compendium, Dusk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&amp;family=Bungee&amp;family=Mr+Dafoe&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:rgba(10, 12, 22, 0.55)}
.oz{font-family:'Bai Jamjuree',system-ui,sans-serif;color:#eef0f8}
.oz *{box-sizing:border-box}
.oz p,.oz h1,.oz h2,.oz h3,.oz ul,.oz ol{margin:0;padding:0}
.oz ul,.oz ol{list-style:none}
.oz button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.oz input{font:inherit;color:inherit}
.oz button:focus-visible,.oz input:focus-visible{outline:2px solid #4fe3ff;outline-offset:2px}
.oz .vt{font-family:'VT323',ui-monospace,monospace;letter-spacing:.04em}
.oz .lbl{font-size:12px;font-weight:600;color:#b0b4ca;letter-spacing:.02em}
.oz .dim{color:#c3c7d9}
.oz .mute{color:#b0b4ca}
.oz .h1{font-family:'Bungee',system-ui,sans-serif;font-weight:400;font-size:24px;line-height:1.1}
.oz .chrome{background:linear-gradient(180deg,#eaf8ff 0%,#9fdcff 42%,#ffffff 49%,#3b2163 51%,#ff5fae 75%,#ffd6ea 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:-1.5px 0 rgba(43, 228, 255, .55),1.5px 0 rgba(255, 47, 146, .55)}
.oz .scan{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:.5;background:repeating-linear-gradient(180deg,rgba(0, 0, 0, .2) 0 1px,transparent 1px 3px)}
.oz .navbtn{height:56px;padding:0 14px;font-size:15px;font-weight:600;color:#c3c7d9}
.oz .navbtn[aria-current="page"]{color:#6fe8ff;text-shadow:0 0 10px rgba(43, 228, 255, .7);box-shadow:inset 0 -2px 0 #4fe3ff}
.oz .subbtn{height:52px;padding:0 14px;font-size:14px;font-weight:600;color:#c3c7d9;display:flex;align-items:center;gap:8px}
.oz .subbtn[aria-current="page"]{color:#eef0f8;box-shadow:inset 0 -2px 0 #4fe3ff}
.oz .btn{min-height:44px;padding:0 16px;border:1px solid rgba(255, 255, 255, 0.2);background:rgba(44, 48, 72, 0.5);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.oz .btn:hover{border-color:rgba(255, 255, 255, 0.32)}
.oz .btn-primary{height:52px;padding:0 24px;background:#ff2f92;color:#12020a;font-family:'Bungee',system-ui,sans-serif;font-size:16px;letter-spacing:.04em;box-shadow:0 5px 0 #8a0f4d,0 0 24px rgba(255, 47, 146, .45);margin-bottom:5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.oz .btn-primary.sm{height:42px;font-size:14px;padding:0 18px;box-shadow:0 4px 0 #8a0f4d,0 0 18px rgba(255, 47, 146, .4);margin-bottom:4px}
.oz .linkbtn{min-height:44px;font-size:14px;font-weight:600;color:#6fe8ff;display:inline-flex;align-items:center;gap:6px}
.oz .iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#c3c7d9;flex:none}
.oz .port{display:flex;align-items:center;justify-content:center;font-weight:700;background:rgba(26, 29, 46, 0.85);border:2px solid #7aa2ff;flex:none}
.oz .panel{background:rgba(26, 29, 46, 0.62);border:1px solid rgba(255, 255, 255, 0.12)}
.oz .tag{font-family:'VT323',ui-monospace,monospace;font-size:16px;line-height:1.25;padding:0 6px;letter-spacing:.04em;white-space:nowrap}
.oz .chip{min-height:36px;padding:0 10px;border:1px solid rgba(255, 255, 255, 0.2);background:rgba(44, 48, 72, 0.5);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.oz .field{height:44px;border:1px solid rgba(255, 255, 255, 0.2);background:rgba(10, 12, 22, 0.55);display:flex;align-items:center;gap:8px;padding:0 12px;color:#b0b4ca;font-size:14px}
.oz .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;width:100%;padding:8px 12px;min-height:52px;border-top:1px solid rgba(255, 255, 255, 0.07)}
.oz .row:hover{background:rgba(60, 66, 96, 0.45)}
.oz .navtab{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#c3c7d9}
.oz .navtab[aria-current="page"]{color:#6fe8ff;text-shadow:0 0 10px rgba(43, 228, 255, .7);box-shadow:inset 0 2px 0 #4fe3ff}
.oz .seg{display:flex;border:1px solid rgba(255, 255, 255, 0.2);background:rgba(10, 12, 22, 0.55);padding:2px;gap:2px}
.oz .seg button{flex:1;min-height:40px;padding:0 12px;font-size:14px;font-weight:600;color:#c3c7d9;white-space:nowrap}
.oz .seg button[aria-pressed="true"]{background:rgba(70, 76, 108, 0.6);color:#eef0f8;box-shadow:inset 0 -2px 0 #4fe3ff}
.oz .switch{width:46px;height:26px;border:1px solid rgba(255, 255, 255, 0.2);background:rgba(10, 12, 22, 0.55);padding:3px;display:flex;flex:none}
.oz .switch span{width:18px;height:18px;background:rgba(255, 255, 255, 0.2)}
.oz .switch[aria-checked="true"]{border-color:#4fe3ff;justify-content:flex-end}
.oz .switch[aria-checked="true"] span{background:#4fe3ff;box-shadow:0 0 8px rgba(43, 228, 255, .8)}
.oz .lamp{width:10px;height:10px;flex:none}
.oz .tbl{width:100%;border-collapse:collapse;font-size:14px}
.oz .tbl th{position:sticky;top:0;background:rgba(18, 20, 34, 0.7);text-align:left;font-size:12px;font-weight:600;color:#b0b4ca;padding:10px 12px;border-bottom:1px solid rgba(255, 255, 255, 0.12);white-space:nowrap}
.oz .tbl td{padding:0 12px;height:48px;border-bottom:1px solid rgba(255, 255, 255, 0.07);white-space:nowrap}
.oz .tbl tr:hover td{background:rgba(60, 66, 96, 0.45)}
.oz .card{border:1px solid rgba(255, 255, 255, 0.12);background:rgba(26, 29, 46, 0.62);padding:12px}
.oz.ph .chip{min-height:44px}
.oz.ph .seg button{min-height:44px}
.oz.ph .btn{min-height:44px}
@media (max-width: 900px){
.oz .lay{height:auto !important;min-height:0 !important}
.oz .cols{display:flex !important;flex-direction:column}
.oz .oz-nav{display:none !important}
}

.oz .scan{opacity:.25 !important}
.oz header,.oz aside,.oz nav,.oz main,.oz section:not(.oz-map):not([aria-label="Battle map"]){-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15)}
body{background:#151a2d}</style>
</head>

</div>

a(255, 255, 255, 0.2); color: #c3c7d9">SRD</span></button></li><li><button style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.07);"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">Goblin Warrior</span><span style="display: block; font-size: 13px; color: #c3c7d9">CR 1/4, small fey</span></span><span class="tag" style="font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.2); color: #c3c7d9">SRD</span></button></li><li><button style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.07); background: rgba(43, 228, 255, 0.07); box-shadow: inset 2px 0 0 #4fe3ff;"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">Grukk Twotooth</span><span style="display: block; font-size: 13px; color: #c3c7d9">CR 2, small fey</span></span><span class="tag" style="font-size: 15px; border: 1px solid #ffd54d; color: #ffd23f">HOMEBREW</span></button></li><li><button style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.07);"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">Hobgoblin Captain</span><span style="display: block; font-size: 13px; color: #c3c7d9">CR 3, medium fey</span></span><span class="tag" style="font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.2); color: #c3c7d9">SRD</span></button></li><li><button style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.07);"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">Hobgoblin Warrior</span><span style="display: block; font-size: 13px; color: #c3c7d9">CR 1/2, medium fey</span></span><span class="tag" style="font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.2); color: #c3c7d9">SRD</span></button></li><li><button style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.07);"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">Worg</span><span style="display: block; font-size: 13px; color: #c3c7d9">CR 1/2, large fey</span></span><span class="tag" style="font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.2); color: #c3c7d9">SRD</span></button></li></ul>
