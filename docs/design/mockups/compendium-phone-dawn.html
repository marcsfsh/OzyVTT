<!doctype html>
<html lang="en">
<head>

<style>
body{margin:0;background:#e3dee8}
.oz{font-family:'Bai Jamjuree',system-ui,sans-serif;color:#2a2537}
.oz *{box-sizing:border-box}
.oz p,.oz h1,.oz h2,.oz h3,.oz ul,.oz ol{margin:0;padding:0}
.oz ul,.oz ol{list-style:none}
.oz button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.oz input{font:inherit;color:inherit}
.oz button:focus-visible,.oz input:focus-visible{outline:2px solid #2a8fa8;outline-offset:2px}
.oz .vt{font-family:'VT323',ui-monospace,monospace;letter-spacing:.04em}
.oz .lbl{font-size:12px;font-weight:600;color:#655d77;letter-spacing:.02em}
.oz .dim{color:#4f4862}
.oz .mute{color:#655d77}
.oz .h1{font-family:'Bungee',system-ui,sans-serif;font-weight:400;font-size:24px;line-height:1.1}
.oz .chrome{background:linear-gradient(180deg,#eaf8ff 0%,#9fdcff 42%,#ffffff 49%,#3b2163 51%,#ff5fae 75%,#ffd6ea 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.oz .scan{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:.5;background:repeating-linear-gradient(180deg,rgba(0, 0, 0, .2) 0 1px,transparent 1px 3px)}
.oz .navbtn{height:56px;padding:0 14px;font-size:15px;font-weight:600;color:#4f4862}

.oz .btn{min-height:44px;padding:0 16px;border:1px solid #b9b0c8;background:#f7f5f9;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}

.oz .panel{background:#f3f0f5;border:1px solid #d3ccdc}
.oz .tag{font-family:'VT323',ui-monospace,monospace;font-size:16px;line-height:1.25;padding:0 6px;letter-spacing:.04em;white-space:nowrap}
.oz .chip{min-height:36px;padding:0 10px;border:1px solid #b9b0c8;background:#f7f5f9;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.oz .field{height:44px;border:1px solid #b9b0c8;background:#e3dee8;display:flex;align-items:center;gap:8px;padding:0 12px;color:#655d77;font-size:14px}
.oz .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;width:100%;padding:8px 12px;min-height:52px;border-top:1px solid #e0dbe6}
.oz .row:hover{background:#e8e3ee}
.oz .navtab{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#4f4862}
.oz .navtab[aria-current="page"]{color:#1d6a80;box-shadow:inset 0 2px 0 #2a8fa8}
.oz .seg{display:flex;border:1px solid #b9b0c8;background:#e3dee8;padding:2px;gap:2px}
.oz .seg button{flex:1;min-height:40px;padding:0 12px;font-size:14px;font-weight:600;color:#4f4862;white-space:nowrap}
.oz .seg button[aria-pressed="true"]{background:#fbfafc;color:#2a2537;box-shadow:inset 0 -2px 0 #2a8fa8}
.oz .switch{width:46px;height:26px;border:1px solid #b9b0c8;background:#e3dee8;padding:3px;display:flex;flex:none}
.oz .switch span{width:18px;height:18px;background:#b9b0c8}
.oz .switch[aria-checked="true"]{border-color:#2a8fa8;justify-content:flex-end}
.oz .switch[aria-checked="true"] span{background:#2a8fa8;box-shadow:none}
.oz .lamp{width:10px;height:10px;flex:none}
.oz .tbl{width:100%;border-collapse:collapse;font-size:14px}
.oz .tbl th{position:sticky;top:0;background:#ebe7ef;text-align:left;font-size:12px;font-weight:600;color:#655d77;padding:10px 12px;border-bottom:1px solid #d3ccdc;white-space:nowrap}
.oz .tbl td{padding:0 12px;height:48px;border-bottom:1px solid #e0dbe6;white-space:nowrap}
.oz .tbl tr:hover td{background:#e8e3ee}
.oz .card{border:1px solid #d3ccdc;background:#f3f0f5;padding:12px}
.oz.ph .chip{min-height:44px}
.oz.ph .seg button{min-height:44px}
.oz.ph .btn{min-height:44px}
@media (max-width: 900px){
.oz .lay{height:auto !important;min-height:0 !important}
.oz .cols{display:flex !important;flex-direction:column}
.oz .oz-nav{display:none !important}
}

.oz .scan{display:none !important}
.oz .chrome{background:none !important;-webkit-background-clip:border-box !important;background-clip:border-box !important;color:#2a2537 !important;text-shadow:-1px 0 rgba(42, 143, 168,.35),1px 0 rgba(255,47,146,.35) !important}
body{background:#ebe7ef}</style>
