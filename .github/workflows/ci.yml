name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# A push to a branch with an open PR fires both triggers. Keying the group on the head branch
# collapses the pair into one run per commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    # The full suite runs about 11 minutes on a hosted runner; the rest takes 4.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
