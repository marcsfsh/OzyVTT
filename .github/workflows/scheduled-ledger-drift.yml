# Scheduled ledger-drift / health check — SCAFFOLDING ONLY (bones).
#
# This workflow intentionally does nothing useful yet. The `schedule:` trigger is
# commented out so it never fires on its own, and the job is a placeholder. It sits
# beside ci.yml so the durable, code-defined half of the scheduling story has a home.
#
# To activate later (see docs/claude-code-tooling-outline.md -> "Scheduled prompts &
# workflows" and .claude/skills/vtt-schedule):
#   1. Uncomment the `schedule:` block below. Cron in Actions is UTC (unlike /loop,
#      which is local time). The minute is deliberately off :00 to avoid the herd.
#   2. Replace the placeholder step with the real job. Candidates:
#        - ledger-drift: diff recent commits against docs/ai-ledger and open an issue
#          (or PR) when shipped work isn't recorded.
#        - health check: npm ci && npm run check && npm test && npm run build.
#        - dependency check: npm audit / outdated report.
#   3. Grant only the permissions that job actually needs (e.g. issues: write).
name: Scheduled ledger-drift (scaffold)

on:
  workflow_dispatch: {} # manual runs only, for now — lets you test the plumbing
  # schedule:
  #   - cron: "17 7 * * *" # 07:17 UTC daily. Uncomment to activate.

permissions:
  contents: read

jobs:
  placeholder:
    name: Placeholder (not configured yet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain that this is scaffolding
        run: |
          echo "This scheduled workflow is scaffolding only and does nothing yet."
          echo "Wire it up per docs/claude-code-tooling-outline.md and .claude/skills/vtt-schedule."
